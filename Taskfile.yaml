version: '3'

includes:
    default: .tk/default/Taskfile.yaml
    git: .tk/git/Taskfile.yaml
    golangci: .tk/golangci/Taskfile.yaml
    install: .tk/install/Taskfile.yaml
    license: .tk/license/Taskfile.yaml
    trufflehog: .tk/trufflehog/Taskfile.yaml


dotenv:
  - .env
  - PROJECT
  - .env.default

tasks:
  mocks:generate:
    desc: Regenerate all mocks with mockery (reads .mockery.yaml)
    cmds:
      - go run github.com/vektra/mockery/v3@latest
    sources:
      - .mockery.yaml
      - executor/**/*.go
      - oci/*.go
    generates:
      - mocks/**/*.go

  mocks:clean:
    desc: Delete generated mocks (regenerate with `task mocks:generate`)
    cmds:
      - rm -rf mocks

  mocks:verify:
    desc: Fail if generated mocks drift from the interfaces they mirror
    cmds:
      - task: mocks:generate
      - git diff --exit-code -- mocks

  test:
    desc: Run the test suite with race detector + coverage
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...

  test:integration:
    desc: |
      Run the opt-in executor e2e tests against a real runtime and model API.
      Requires OTTERS_E2E_API_BASE (e.g. a local meridian proxy) and
      OTTERS_E2E_RUNTIME_BIN; add OTTERS_E2E_RUNTIME_IMAGE for the docker
      backend. Without them the tests skip. See ./integration package docs.
    cmds:
      - go test -v ./integration

