version: '3'

includes:
    default: .tk/default/Taskfile.yaml
    git: .tk/git/Taskfile.yaml
    golangci: .tk/golangci/Taskfile.yaml
    install: .tk/install/Taskfile.yaml
    license: .tk/license/Taskfile.yaml
    trufflehog: .tk/trufflehog/Taskfile.yaml


dotenv:
  - .env
  - PROJECT
  - .env.default

tasks:
  mocks:generate:
    desc: Regenerate all mocks with mockery (reads .mockery.yaml)
    cmds:
      - go run github.com/vektra/mockery/v3@latest
    sources:
      - .mockery.yaml
      - agent/**/*.go
      - oci/*.go
    generates:
      - mocks/**/*.go

  mocks:clean:
    desc: Delete generated mocks (regenerate with `task mocks:generate`)
    cmds:
      - rm -rf mocks

  mocks:verify:
    desc: Fail if generated mocks drift from the interfaces they mirror
    cmds:
      - task: mocks:generate
      - git diff --exit-code -- mocks

  test:
    desc: Run the test suite with race detector + coverage
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...

  proto:gen:
    desc: |
      Regenerate Go + gRPC bindings from executor/api/v1/agent.proto.
      Requires `protoc` on PATH plus protoc-gen-go and
      protoc-gen-go-grpc; install via `go install
      google.golang.org/protobuf/cmd/protoc-gen-go@latest` and
      `go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest`.
    cmds:
      - protoc --proto_path=executor/api/v1 --go_out=executor/api/v1 --go_opt=paths=source_relative --go-grpc_out=executor/api/v1 --go-grpc_opt=paths=source_relative executor/api/v1/agent.proto